[project]
name = "jt-ipam-backend"
# 版本由 app/version.py 提供（見 [tool.hatch.version]）—— 這裡曾經寫死 0.3.0
# 並在版本推進到 0.6.x 之後仍然沒改：發版流程只會記得改 version.py、package.json
# 與兩份 README，多一個要手動同步的地方就是遲早會過期的地方。
dynamic = ["version"]
description = "jt-ipam — 以整合為核心的 IPAM 系統後端"
authors = [
    {name = "Jason Tools Co., Ltd.", email = "support@example.com"},
]
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    # ── Web framework ──
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",             # PVE 主控台（noVNC/xterm）後端對接 PVE vncwebsocket 的 client WS
    "starlette>=1.3.1",

    # ── Validation ──
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.2",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # ── Security (A02 / A07) ──
    "argon2-cffi>=23.1",          # argon2id 密碼雜湊
    "cryptography>=50.0.0",          # AES-GCM、TLS、簽章
    "defusedxml>=0.7",             # 安全 XML 解析（OPNsense config.xml；擋 XXE）
    "pyjwt[crypto]>=2.14.0",         # JWT（2.13 有 11 個 CVE，2026-09-30 pip-audit）
    "pyotp>=2.9",                  # TOTP MFA
    "python-multipart>=0.0.31",    # 表單
    # requests／sentry-sdk 帶進來的：寫下限，既有站台升級時 pip 才會換掉有漏洞的版本（2.7 有 3 個 CVE）
    "urllib3>=2.8.0",
    # Security floors also apply to existing environments that pip would otherwise retain.
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "multidict>=6.9.1",
    "pyasn1>=0.6.4",

    # ── Network / IP ──
    "httpx[http2]>=0.27",          # 統一 async HTTP client（A10 SSRF 包裝）

    # ── 外部系統連線 ──
    "pymysql>=1.1",                # phpIPAM 遷移工具：直連舊 MySQL
    "asyncssh>=2.24.0",            # phpIPAM 遷移工具：SSH tunnel（MySQL 通常只 listen 127.0.0.1）
    "ldap3>=2.9",                  # AD/LDAP 認證
    "pyrad>=2.4",                  # Radius 認證
    "dnspython>=2.6",              # BIND 9 AXFR + nsupdate (TSIG)
    "pywinrm>=0.5",                # Windows DNS（WinRM + PowerShell）
    "geoip2>=4.8",                 # GeoIP：MaxMind GeoLite2/GeoIP2 mmdb 本地查詢（含 maxminddb reader）

    # ── SSO（Phase 3）──
    "authlib>=1.3",                # OIDC / OAuth2
    "python3-saml>=1.16",          # SAML 2.0

    # ── AI ──
    "pgvector>=0.3",                        # Phase 2 語意搜尋向量欄位
    "mcp>=1.28.1",                             # Phase 4 Model Context Protocol

    # ── Caching / Queue ──
    "redis[hiredis]>=5.2",
    "celery>=5.4",

    # ── Observability ──
    "structlog>=24.4",             # 結構化日誌（A09）
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
# aardwolf（選用）：RDP／VNC 主控台的舊引擎，2026-09-27 起只是 guacd 停掉時的備用引擎 ——
# guacd 是必要元件、預設引擎（不是 pip 套件，由 scripts/jt-ipam.sh 裝，見 app/services/guacd.py）。
# 在 Python 3.14 上會當掉（GitHub issue #42），沒有任何功能依賴它。
# pin 0.2.13 — PyPI 有 cp311/312/313 manylinux x86_64 wheel（內含已編譯的 librlers
# Rust 擴充）→ 安裝免 Rust 工具鏈。最新 0.2.14 只有 sdist（要 Rust）故不可用 latest。
# 安裝腳本以 `pip install --only-binary=:all: -e ".[rdp]"` best-effort 裝；沒 wheel 即快速
# 失敗、不觸發 Rust 編譯，只是沒有備用引擎、不影響主安裝。
rdp = [
    "aardwolf==0.2.13",
]
# FreeRDP 引擎（選用）：相容性比 aardwolf 好 —— Linux 上的 xrdp 與 GNOME 遠端登入會
# 拒絕 aardwolf 的 NTLM 認證（asyauth 0.0.23 不送 MIC）。這一組只是「抓畫面／打鍵盤滑鼠」
# 用的純 Python 套件，都很小；真正重的是 apt 的 freerdp2-x11 與 xvfb，那兩個由
# `scripts/jt-ipam.sh install --with-freerdp` 或 upgrade 時依設定自動補上。
rdp-freerdp = [
    "python-xlib>=0.33",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-github-actions-annotate-failures>=0.2",  # CI 失敗轉 GH annotation（公開 API 可讀）
    "pytest-timeout>=2.3",         # CI 單一測試卡住時判失敗（轉成 annotation 就知道是哪一支）
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",           # SAST
    "pip-audit>=2.7",              # CVE 掃描
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/version.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "RUF",
    "ASYNC",
    "PT",
]
ignore = [
    "S101",  # assert in tests OK
    "E501",  # line length 由 formatter 處理
    # 本專案大量使用繁中全形標點於 docstring / 註解 / 字串 —— 屬刻意，不是錯字
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode（全形標點誤判）
    "B008",   # FastAPI 慣例：Depends()/Query() 放在 default argument
    "ASYNC109",  # 對外請求刻意帶 timeout 參數（safe_request 約定）
    "N818",   # 既有例外命名（SubnetOverlap / OPNsenseError…），不強制 Error 後綴
    # 既有風格 / 框架慣例（刻意，不視為錯誤）：
    "E701", "E702",  # 單行 if x: y / a; b（本專案大量使用，屬風格）
    "RUF012",  # ORM/Pydantic model 的可變預設值（Mapped[list] 等）
    "S110",    # try/except/pass：best-effort 同步刻意吞錯（皆有註解說明）
    "C416",    # 解析式風格
    # 命名：刻意沿用外部欄位 / SQLAlchemy model 名 / SNMP sysObjectID 等大小寫
    "N803", "N806", "N811", "N814", "N815",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E402"]
# 模型匯總模組：import 各 model 是為了註冊到 metadata（非未使用）
"app/models/__init__.py" = ["F401"]
# 這些檔有刻意的 late import（避免循環匯入 / 條件載入）
"app/api/phpipam/endpoints/addresses.py" = ["E402"]
"app/api/phpipam/endpoints/subnets.py" = ["E402"]
"app/api/v1/endpoints/auth.py" = ["E402"]
"app/api/v1/endpoints/migration.py" = ["E402"]
"app/api/v1/endpoints/notifications.py" = ["E402"]
# E402: 刻意的 late import；PT019: `test_notification_email` 等是 FastAPI 端點（非 pytest），`_user` 是依賴注入非 fixture
"app/api/v1/endpoints/system_settings.py" = ["E402", "PT019"]

# ─────────────────────────────────────────────────────────
# Mypy
# ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# 第三方套件無型別 stub（py.typed）→ 不分析其匯入，避免 import-untyped 連鎖
[[tool.mypy.overrides]]
module = [
    "pyrad.*", "onelogin.*", "ldap3.*", "pymysql.*",
    "defusedxml.*", "winrm.*", "pywinrm.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# anyio 的 pytest 外掛停用：非同步測試一律由 pytest-asyncio 在同一個（session）loop 跑。
# 兩個外掛都在時，`@pytest.mark.anyio` 的測試由誰接手取決於外掛的載入順序 —— 那又取決於
# site-packages 目錄在檔案系統上的列舉順序，每台機器不同。anyio 先接手時它用自己的 loop，
# 共用連線池裡的 asyncpg 連線就被帶到別的 loop（"attached to a different loop"），接著整套卡死：
# 開發機一直是綠的，GitHub CI 卻跑到逾時（2026-09-26 在本機強制 `-p asyncio -p anyio` 重現）。
addopts = "-p no:anyio"
markers = [
    "anyio: 舊的標記，保留相容；anyio 外掛已停用（見 addopts），測試照樣由 pytest-asyncio 執行",
]
filterwarnings = [
    "error",
    # 第三方依賴的 DeprecationWarning 不阻擋測試
    "ignore::DeprecationWarning:pyasn1",
    "ignore::DeprecationWarning:ldap3",
    "ignore::DeprecationWarning:alembic",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:asyncio",
    # anyio 在 Python 3.11+ 用 Task.cancel("msg") 觸發 DeprecationWarning
    # 若把 warning → error，CancelScope 取消傳遞失敗，整個 ASGI 測試會 hang
    "ignore::DeprecationWarning:anyio",
    "ignore::DeprecationWarning",
    # asyncpg/redis 的 connection __del__ 會在 GC 時噴 ResourceWarning，與測試無關
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ─────────────────────────────────────────────────────────
# Bandit (SAST)
# ─────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "alembic/versions"]
skips = ["B101"]
